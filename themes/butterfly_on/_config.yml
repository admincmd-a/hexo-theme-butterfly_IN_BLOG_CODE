# 主开关
# --------------------------------------
enable: true # [ true | false ]

# Navigation bar settings (導航欄設置)
# see https://butterfly.js.org/posts/4aa8abbe/##導航欄設置-Navigation-bar-settings
# --------------------------------------
nav:
  enable: true # [ true | false ]
  logo: # image
  display_title: true
  fixed: false # fixed navigation bar

  # Menu 菜单
  menu:
    enable: true # 启用菜单
    item:
      主页: / || fas fa-home
      转到||fas fa-arrow-right:
        归档: /archives/ || fas fa-archive
        标签: /tags/ || fas fa-tags
        分类: /categories/ || fas fa-folder-open
        链接: /bd_link/ || fas fa-link
        关于: /about/ || fa-solid fa-circle-info
        日志: /log/ || fa-solid fa-list
        友链: /link/ || fas fa-solid fa-user-group
      资源||fas fa-images:
        图片: /zy/ || fas fa-images
        # 网站: /zy/www/ || fa-solid fa-globe
        # 软件与实用工具: /zy/app/ || fa-regular fa-window-restore
      留言板: /lyb_files/ || fas fa-comment
      杂项||fas fa-ellipsis-h:
        随便看看: javascript:justLookAround(); || fa-brands fa-stack-overflow
        太公钓鱼: /cnm.html || fas fa-fish
        # 测试页面: /favi/time.html || fa-solid fa-code
        # ATOM: /atom.xml || fa-solid fa-rss
        RSS: /atom.xml || fa-solid fa-rss
        时光飞逝: /favi/ || fa-solid fa-clock
        声明 & Cookies: /license/ || fas fa-solid fa-file-contract
        隐私政策: /privacy/ || fas fa-solid fa-user-secret
        # 线路总览: /server/ || fas fa-link
        # 服务器监视器: http://status.admincmd.xyz/ || fa-solid fa-chart-line
        设置: javascript:configWin.main(); || fa-solid fa-cog
      # "开往": 
      #   NoMenu: true
      #   url: https://www.travellings.cn/go.html 
      #   icon: fas fa-subway
      "搜索||fas fa-magnifying-glass": SEARCH_BUTTON

      # 定义：
      # 无子菜单项目
      # [1]: [2] || [3]
      # 配置项: html
      # 有子菜单项目
      # [1]||[3]: 
      #    [4]
      # 专用项目
      # [1]||[3]: [5]
      # 1=> 菜单名称 2=> 地址 3=> 图标 4=> 子菜单 5=> 专用语句
      # 专用语句：SEARCH_BUTTON

#  链接||fas fa-link: 
#    BiliBili: https://space.bilibili.com/518747636 || fa-solid fa-code #|| fas fa-music
#    AcFun: https://www.acfun.cn/u/73666172 #|| fas fa-video
#    爱发电: https://afdian.net/a/admin_cmd
#    QQ: /favi/qq.html


# Code Blocks (代碼相關)
# --------------------------------------

highlight_theme: mac light #  darker / pale night / light / ocean / mac / mac light / false
highlight_copy: true # copy button
highlight_lang: true # show the code language
highlight_shrink: false # true: shrink the code blocks / false: expand the code blocks | none: expand code blocks and hide the button
highlight_height_limit: 500 # unit: px
code_word_wrap: false

# Social Settings (社交圖標設置)
formal: 
 icon: link #link || the description || color
social: 
  fas fa-envelope: /favi/email.html || Email || '#4a7dbe'
  fab fa-github: https://github.com/admincmd-a || Github || '#24292e'
  iconfont icon-bilibili-line: https://space.bilibili.com/518747636 || BiliBili || '#4a7dbe'
  iconfont icon-qq: https://wpa.qq.com/msgrd?v=3&uin=3374235679&site=qq&menu=yes || QQ || '#4a7dbe'
  # fas fa-envelope: mailto: xxxxxx@gmail.com || Email || '#4a7dbe'

# Image (圖片設置)
# --------------------------------------

# Favicon（網站圖標）
favicon: /favicon.ico

# Avatar (頭像)
avatar: 
  img: /img/logo-bit3.png
  effect: false

# Disable all banner image
disable_top_img: false

# The banner image of home page
index_img: https://unpkg.com/admincmd-blog-img-0@1.0.1/IMG_44.webp #26.png

# If the banner of page not setting, it will show the top_img
default_top_img: 
  #- https://s21.ax1x.com/2024/06/02/pkGtEfe.jpg
  #- https://s21.ax1x.com/2024/06/02/pkGtPw6.jpg
  #- https://s21.ax1x.com/2024/06/02/pkGtAYD.jpg
  - https://unpkg.com/admincmd-blog-img-0@1.0.1/IMG_44.webp
  #- https://s21.ax1x.com/2024/06/02/pkGtkFO.jpg
  ##- https://s21.ax1x.com/2024/06/020./pkGtiTK.jpg
  #- https://s21.ax1x.com/2024/06/02/pkGtEfe.jpg

# The banner image of archive page
archive_img: https://unpkg.com/admincmd-blog-img-0@1.0.1/IMG_44.webp

# If the banner of tag page not setting, it will show the top_img
# note: tag page, not tags page (子標籤頁面的 top_img)
tag_img: https://unpkg.com/admincmd-blog-img-0@1.0.1/IMG_44.webp
                                   
# The banner image of tag page
# format:
#  - tag name: xxxxx
tag_per_img: https://unpkg.com/admincmd-blog-img-0@1.0.1/IMG_44.webp

# If the banner of category page not setting, it will show the top_img
# note: category page, not categories page (子分類頁面的 top_img)
category_img: https://unpkg.com/admincmd-blog-img-0@1.0.1/IMG_44.webp

# The banner image of category page
# format:
#  - category name: xxxxx
category_per_img: https://unpkg.com/admincmd-blog-img-0@1.0.1/IMG_44.webp

cover:
  # display the cover or not (是否顯示文章封面)
  index_enable: true
  aside_enable: true
  archives_enable: true
  # the position of cover in home page (封面顯示的位置)
  # left/right/both
  position: both
  # When cover is not set, the default cover is displayed (當沒有設置cover時，默認的封面顯示)
  default_cover: 
    #  - https://img.picui.cn/free/2024/06/02/665bf11b0c77e.png
    #  - https://img.picui.cn/free/2024/06/02/665bf11b39d15.png
    #  - https://s21.ax1x.com/2024/06/02/pkGtPw6.jpg
    #  - https://s21.ax1x.com/2024/06/02/pkGtAYD.jpg
    #  - https://s21.ax1x.com/2024/06/02/pkGtCex.jpg
    #  - https://s21.ax1x.com/2024/06/02/pkGtkFO.jpg
    #  - https://s21.ax1x.com/2024/06/020./pkGtiTK.jpg
    #  - https://s21.ax1x.com/2024/06/02/pkGtEfe.jpg
# 
# Replace Broken Images (替換無法顯示的圖片)
error_img: 
  flink: /img/404.gif
  post_page: /img/404.gif

# A simple 404 page
error_404: 
  enable: true
  subtitle: ''
  background: /img/404.gif
  description: '3S 后返回首页'
  sleep: true # 在进入后跳转回主页页面

post_meta:
  page: # Home Page
    date_type: both # created or updated or both 主頁文章日期是創建日或者更新日或都顯示
    date_format: date # date/relative 顯示日期還是相對日期
    categories: true # true or false 主頁是否顯示分類
    tags: true # true or false 主頁是否顯示標籤
    label: true # true or false 顯示描述性文字
  post:
    date_type: both # created or updated or both 文章頁日期是創建日或者更新日或都顯示
    date_format: date # date/relative 顯示日期還是相對日期
    categories: true # true or false 文章頁是否顯示分類
    tags: true # true or false 文章頁是否顯示標籤
    label: true # true or false 顯示描述性文字

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content:
  method: 3
  length: 500 # if you set method to 2 or 3, the length need to config

# anchor
anchor:
  # when you scroll, the URL will update according to header id.
  auto_update: true
  # Click the headline to scroll and update the anchor
  click_to_scroll: false

# figcaption (圖片描述文字)
photofigcaption: false

# copy settings
# copyright: Add the copyright information after copied content (複製的內容後面加上版權信息)
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 50

# Post
# --------------------------------------

# toc (目錄)
toc:
  post: true
  page: true
  number: true
  expand: true
  style_simple: false # for post
  scroll_percent: true

post_copyright:
  enable: true
  decode: true
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# Post edit
# Easily browse and edit blog source code online.
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# Related Articles
related_post:
  enable: true
  limit: 6 # Number of posts displayed
  date_type: created # or created or updated 文章日期顯示創建日或者更新日

# post_pagination (分頁)
# value: 1 || 2 || false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 1

# Displays outdated notice for a post (文章過期提醒)
noticeOutdate: 
  enable: true
  style: flat # style: simple/flat
  limit_day: 365 # When will it be shown
  position: top # position: top/bottom
  message_prev: 这篇文章于  # 数字前段文本
  message_next:  天前由 管理员 - 命令提示符 修改了下，内容貌似有些过时了 # 数字后段文本

