  # cssUrl: https://artalk.example.com/dist/Artalk.css
# 
  # 文章阅读数统计
  # pvCount: true
# 
  # 评论数统计
  # commentCount: true
# 
  # 黑暗模式
  # darkMode: auto
# 
  # 在后端控制前端
  # 参考：https://artalk.js.org/guide/backend/fe-control.html
  # useBackendConf: false

  # --------------------------------------------------------

search:
  path: search.xml
  field: post
  content: true
  template: ./search/index.xml

  # ------------------------------------------------------

aplayer:
  meting: false
  asset_inject: false
  #script_dir: some/place                        # Public 目录下脚本目录路径，默认: 'assets/js'
  #style_dir: some/place                         # Public 目录下样式目录路径，默认: 'assets/css'
  #cdn: http://xxx/aplayer.min.js                # 引用 APlayer.js 外部 CDN 地址 (默认不开启)
  #tyle_cdn: http://xxx/aplayer.min.css         # 引用 APlayer.css 外部 CDN 地址 (默认不开启)
  ##meting: true                                  # MetingJS 支持
  #meting_api: http://xxx/api.php                # 自定义 Meting API 地址
  #meting_cdn: http://xxx/api.php          # 引用 Meting.js 外部 CDN 地址 (默认不开启)
  ## asset_inject: true                            # 自动插入 Aplayer.js 与 Meting.js 资源脚本, 默认开启
  #externalLink: http://xxx/aplayer.min.js       # 老版本参数，功能与参数 cdn 相同
# ---------

# Extensions 
## Plugins: http://hexo.io/plugins/
#RSS订阅
plugin:
- hexo-generator-feed
#Feed Atom
feed:
type: atom
path: atom.xml
limit: 20

hexo_submit_urls_to_search_engine:
  submit_condition: count #链接被提交的条件，可选值：count | period 现仅支持count
  count: 7 # 提交最新的10个链接
  period: 900 # 提交修改时间在 900 秒内的链接
  google: 0 # 是否向Google提交，可选值：1 | 0（0：否；1：是）
  bing: 1 # 是否向bing提交，可选值：1 | 0（0：否；1：是）
  baidu: 0 # 是否向baidu提交，可选值：1 | 0（0：否；1：是）
  txt_path: submit_urls.txt ## 文本文档名， 需要推送的链接会保存在此文本文档里
  baidu_host: https://blog.admincmd.xyz ## 在百度站长平台中注册的域名
  baidu_token: RwULMXYGeUtkpNqK ## 请注意这是您的秘钥， 所以请不要把它直接发布在公众仓库里!
  bing_host: https://blog.admincmd.xyz ## 在bing站长平台中注册的域名
  bing_token: 458a28cf87bb48f58c3fc72041114958 ## 请注意这是您的秘钥， 所以请不要把它直接发布在公众仓库里!
  google_host: https://cjh0613.github.io ## 在google站长平台中注册的域名
  google_key_file: Project.json #存放google key的json文件，放于网站根目录（与hexo _config.yml文件位置相同），请不要把json文件内容直接发布在公众仓库里!
  google_proxy: http://127.0.0.1:8080 # 向谷歌提交网址所使用的系统 http 代理，填 0 不使用
  replace: 0  # 是否替换链接中的部分字符串，可选值：1 | 0（0：否；1：是）
  find_what: https://admincmd.xyz
  replace_with: https://blog.admincmd.xyz


