# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Bing Admin Key: 458a28cf87bb48f58c3fc72041114958
# Site
title: 管理员 - 命令提示符
subtitle: Blog
description: '管理员 - 命令提示符 的 Blog 的 主页(AdmincmdのBlog)'
keywords: 管理员 - 命令提示符,Admincmd,Admin-cmd,管理员 - 命令提示符 的 Blog
author: 管理员 - 命令提示符
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.admincmd.xyz
permalink: post/:hash/index.html
abbrlink:
  alg: crc32  # 算法：crc16(default) and crc32
  rep: hex    # 进制：dec(default) and hex

permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "html/**"
  - "html/time.md"
  - "*.html"
  - "*.htm"
  - "*.xml"
  - "README.md"

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly_on #_1

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  - type: 'git'
    #repo: 'git@github.com:admincmd-a/admincmd-a.github.io.git'
    repository: git@github.com:admincmd-a/github-blog.admincmd.xyz.git
  - type: cjh_google_url_submitter
  - type: cjh_bing_url_submitter
  - type: cjh_baidu_url_submitter
  

#_________________________________________________________________
memorial_day:
  # Better to close it when it is not used
  enable: true
  # Specified date will be greyed, you can set yyyy-MM-dd or MM-dd
  day: 05-12
  #<a href="https://icp.gov.moe/?keyword=20231986" target="_blank">萌ICP备20231986号</a>

  # Artalk 配置文件
# 更多信息: https://artalk.js.org

# artalk:
  # enable: true
# 
  # 后端程序 API 地址，请修改为您自己的 API 地址
