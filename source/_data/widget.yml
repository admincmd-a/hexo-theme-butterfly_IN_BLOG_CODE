######## 
######## 参数	解释
######## class_name	所创建的 widget 父类 class 名 （可选）
######## id_name	所创建的 widget 父类 id 名（可选）
######## name	所创建的 widget 标题
######## icon	所创建的 widget 图标
######## order	所创建的 widget 排序 （可选）
######## html	所创建的 widget 相关代码
######## 
